[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "multicluster-health"
version = "1.0.0"
description = "Multi-cluster Kubernetes health monitoring dashboard and CLI"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "click>=8.0",
    "flask>=3.0",
    "kubernetes>=30.0",
]

[project.scripts]
multicluster-health = "multicluster_health.cli:cli"

[tool.setuptools.packages.find]
include = [
    "multicluster_health",
    "multicluster_health.*",
]
